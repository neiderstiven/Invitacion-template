# LEGADO: la producción del front está en Vercel.
# Este workflow solo publica un respaldo manual en GitHub Pages; no se ejecuta
# en cada push.
#
# IMPORTANTE (una sola vez): en el repo -> Settings -> Pages -> Build and
# deployment -> Source = "GitHub Actions". Si se deja en "Deploy from a branch",
# Pages sirve el index.html SIN compilar y la página queda en blanco.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # `pnpm run build` aplica .env.production (VITE_API_BASE_URL) y el base
      # del subpath (/skymarket/) definido en vite.config.ts.
      - name: Build project
        run: pnpm run build

      # GitHub Pages no reescribe rutas del SPA: copiamos index.html a 404.html
      # para que una recarga en p. ej. /skymarket/products siga cargando
      # la app (el basename de React Router resuelve la ruta).
      - name: SPA fallback (404.html) + sin Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5